      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: Tambah Pengumuman (Admin/Kaprodi)
      tags:
      - Announcements
  /admin/announcements/delete:
    delete:
      description: Menghapus pengumuman berdasarkan ID
