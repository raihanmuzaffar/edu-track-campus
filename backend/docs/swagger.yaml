basePath: /api/v1
definitions:
  handlers.AdminUserInput:
    properties:
      email:
        type: string
      name:
        minLength: 3
        type: string
      password:
        minLength: 8
        type: string
      role:
        enum:
        - admin
        - kaprodi
        - dosen
        - mahasiswa
        - orangtua
        type: string
    required:
    - email
    - name
    - role
    type: object
  handlers.AnnouncementInput:
    properties:
      category:
        type: string
      content:
        type: string
      end_date:
        description: 'Format: YYYY-MM-DD'
        type: string
      start_date:
        description: 'Format: YYYY-MM-DD'
        type: string
      status:
        enum:
        - Draf
        - Aktif
        - Berakhir
        type: string
      title:
        type: string
    required:
    - category
    - content
    - end_date
    - start_date
    - status
    - title
    type: object
  handlers.AttendanceInput:
    properties:
      class_id:
        type: integer
      date:
        type: string
      mahasiswa_id:
        type: integer
      status:
        enum:
        - hadir
        - izin
        - sakit
        - alpa
        type: string
    required:
    - class_id
    - date
    - mahasiswa_id
    - status
    type: object
  handlers.CaseInput:
    properties:
      followup:
        type: string
      level:
        type: string
      reason:
        type: string
      status:
        enum:
        - Draf
        - Diajukan
        - Perlu
        - diperiksa
        - Diterbitkan
        - (simulasi)
        - Ditutup
        type: string
      student_id:
        type: integer
    required:
    - followup
    - level
    - reason
    - status
    - student_id
    type: object
  handlers.ClassInput:
    properties:
      course_id:
        type: integer
      day:
        enum:
        - Senin
        - Selasa
        - Rabu
        - Kamis
        - Jumat
        - Sabtu
        type: string
      dosen_id:
        type: integer
      end_time:
        type: string
      name:
        type: string
      room:
        type: string
      start_time:
        type: string
    required:
    - course_id
    - day
    - dosen_id
    - end_time
    - name
    - room
    - start_time
    type: object
  handlers.CourseInput:
    properties:
      code:
        type: string
      name:
        minLength: 3
        type: string
      semester:
        type: integer
      sks:
        maximum: 6
        type: integer
    required:
    - code
    - name
    - semester
    - sks
    type: object
  handlers.DocumentInput:
    properties:
      date:
        description: 'Format: YYYY-MM-DD'
        type: string
      semester:
        type: string
      status:
        enum:
        - Lengkap
        - Memerlukan
        - perbaikan
        - Draf
        type: string
      student_id:
        type: integer
      type:
        type: string
    required:
    - date
    - semester
    - status
    - student_id
    - type
    type: object
  handlers.EnrollmentInput:
    properties:
      class_id:
        type: integer
    required:
    - class_id
    type: object
  handlers.GradeInput:
    properties:
      class_id:
        type: integer
      letter:
        enum:
        - A
        - AB
        - B
        - BC
        - C
        - D
        - E
        type: string
      mahasiswa_id:
        type: integer
      score:
        maximum: 100
        minimum: 0
        type: number
    required:
    - class_id
    - letter
    - mahasiswa_id
    - score
    type: object
  handlers.KHSInput:
    properties:
      semester:
        type: string
      status:
        enum:
        - Siap
        - dipublikasikan
        - Perlu
        - diperiksa
        type: string
      student_id:
        type: integer
    required:
    - semester
    - status
    - student_id
    type: object
  handlers.LinkInput:
    properties:
      parent_id:
        type: integer
      student_id:
        type: integer
    required:
    - parent_id
    - student_id
    type: object
  handlers.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.PackageInput:
    properties:
      class_ids:
        items:
          type: integer
        type: array
      course_ids:
        items:
          type: integer
        type: array
      name:
        type: string
      status:
        enum:
        - Draf
        - Siap
        type: string
      term:
        type: integer
    required:
    - class_ids
    - course_ids
    - name
    - status
    - term
    type: object
  handlers.RegisterInput:
    properties:
      email:
        type: string
      name:
        minLength: 3
        type: string
      password:
        minLength: 8
        type: string
      role:
        enum:
        - admin
        - kaprodi
        - dosen
        - mahasiswa
        - orangtua
        type: string
    required:
    - email
    - name
    - password
    - role
    type: object
  handlers.ScheduleInput:
    properties:
      class_id:
        type: integer
      course_id:
        type: integer
      day:
        enum:
        - Senin
        - Selasa
        - Rabu
        - Kamis
        - Jumat
        - Sabtu
        type: string
      end_time:
        type: string
      room:
        type: string
      semester:
        type: string
      start_time:
        type: string
      teacher_id:
        type: integer
    required:
    - class_id
    - course_id
    - day
    - end_time
    - room
    - semester
    - start_time
    - teacher_id
    type: object
  handlers.UKTInput:
    properties:
      billed:
        minimum: 0
        type: number
      due_date:
        description: 'Format: YYYY-MM-DD'
        type: string
      paid:
        minimum: 0
        type: number
      semester:
        type: string
      student_id:
        type: integer
    required:
    - billed
    - due_date
    - paid
    - semester
    - student_id
    type: object
  utils.Response:
    properties:
      data: {}
      message:
        type: string
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: admin@edutrack.com
    name: Raihan Muzaffar
  description: Sistem Informasi Tracking Akademik (Backend)
  termsOfService: http://swagger.io/terms/
  title: EduTrack Campus API
  version: "1.0"
