name: Web Admin CI (React)

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'web-admin/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web-admin

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Gunakan versi LTS yang stabil
        cache: 'npm'
        cache-dependency-path: './web-admin/package-lock.json'

    - name: Install Dependencies
      # 'npm ci' lebih cepat dan ketat daripada 'npm install', cocok untuk CI
      run: npm ci

    - name: Run Linter
      # Jika linter bawaan Vite terlalu ketat, kita bisa beri flag agar warning tidak menggagalkan CI
      run: npm run lint -- --max-warnings=0 || echo "Linting failed, please check locally"

    - name: Build Project
      # Ini memastikan kode React benar-benar bisa di-compile untuk production
      run: npm run build