name: Web Admin CI (React)

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'web-admin/**' # KUNCI: Hanya jalan jika folder web-admin berubah

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './web-admin/package-lock.json'

    - name: Install Dependencies
      working-directory: ./web-admin
      run: npm ci

    - name: Run Linter
      working-directory: ./web-admin
      run: npm run lint

    - name: Build Project
      working-directory: ./web-admin
      run: npm run build