name: Mobile CI (Flutter)

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.9' # <--- DISESUAIKAN DENGAN REKOMENDASI ERROR
        channel: 'stable'
        cache: true

    - name: Get Dependencies
      run: flutter pub get

    - name: Analyze Code
      run: flutter analyze --no-fatal-infos

    - name: Run Tests
      run: flutter test