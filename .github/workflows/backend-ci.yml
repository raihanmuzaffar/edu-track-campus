name: Backend CI (Go)

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # TAMBAHAN BARU: Menyalakan Database PostgreSQL untuk Testing
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin_edutrack
          POSTGRES_PASSWORD: supersecretpassword123
          POSTGRES_DB: edutrack_db
        ports:
          - 5432:5432
        # Memastikan tes menunggu sampai database benar-benar siap
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.0'

    - name: Install Dependencies
      working-directory: ./backend
      run: |
        go mod tidy
        go mod download

    - name: Run Linter (Manual CLI)
      working-directory: ./backend
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.60.1
        golangci-lint run --timeout=5m

    - name: Run Tests
      working-directory: ./backend
      env:
        # Memberitahu Go untuk terhubung ke service postgres di atas
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: admin_edutrack
        DB_PASSWORD: supersecretpassword123
        DB_NAME: edutrack_db
      run: go test -v ./...

    - name: Build Docker Image
      working-directory: ./backend
      run: docker build -t edu-track-backend:test .