name: Backend CI (Go)

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Install Dependencies & Build
      working-directory: ./backend
      run: |
        go mod tidy
        go mod download
        go build ./...

    - name: Run Linter (Manual CLI)
      working-directory: ./backend
      run: |
        # Unduh dan install golangci-lint secara manual
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.60.1
        # Jalankan linter setelah memastikan build berhasil
        golangci-lint run --timeout=5m

    - name: Run Tests
      working-directory: ./backend
      run: go test -v ./...

    - name: Build Docker Image
      working-directory: ./backend
      run: docker build -t edu-track-backend:test .