name: Backend CI (Go)

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.0' # <--- DISAMAKAN DENGAN VERSI LOKAL ANDA

    - name: Install Dependencies
      working-directory: ./backend
      run: |
        go mod tidy
        go mod download

    - name: Install and Run Linter
      working-directory: ./backend
      run: |
        # Instal golangci-lint menggunakan Go 1.26.0 agar kompatibel
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        # Jalankan linter
        $(go env GOPATH)/bin/golangci-lint run --timeout=5m

    - name: Run Tests
      working-directory: ./backend
      run: go test -v ./...

    - name: Build Docker Image
      working-directory: ./backend
      run: docker build -t edu-track-backend:test .