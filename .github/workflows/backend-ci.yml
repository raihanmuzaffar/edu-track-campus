name: Backend CI (Go)

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**' # Hanya jalan jika ada perubahan di folder backend

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22' # Sesuaikan dengan versi Go Anda

    - name: Install Dependencies
      working-directory: ./backend
      run: go mod download

    - name: Run Linter (golangci-lint)
      uses: golangci/golangci-lint-action@v4
      with:
        working-directory: ./backend

    - name: Run Tests
      working-directory: ./backend
      run: go test -v ./...

    - name: Build Docker Image
      working-directory: ./backend
      run: docker build -t edu-track-backend:test .