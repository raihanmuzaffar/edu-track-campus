name: Backend CI (Go)

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin_edutrack
          POSTGRES_PASSWORD: supersecretpassword123
          POSTGRES_DB: edutrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.0'

    - name: Install Dependencies
      working-directory: ./backend
      run: |
        go mod tidy
        go mod download

    - name: Run Linter
      working-directory: ./backend
      run: |
        # PERBAIKAN: Instal golangci-lint v2 yang mendukung Go 1.26
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1
        $(go env GOPATH)/bin/golangci-lint run --timeout=5m

    - name: Run Tests
      working-directory: ./backend
      env:
        EDUTRACK_TEST_DATABASE_DSN: host=localhost user=admin_edutrack password=supersecretpassword123 dbname=edutrack_test port=5432 sslmode=disable TimeZone=Asia/Jakarta
      run: go test -v ./...

    - name: Build Docker Image
      working-directory: ./backend
      run: docker build -t edu-track-backend:test .