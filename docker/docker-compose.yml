

services:
  # 1. Database PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: edutrack-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edutrack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Cache Redis
  redis:
    image: redis:7-alpine
    container_name: edutrack-redis
    ports:
      - "6379:6379"
    networks:
      - edutrack-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Backend Go (Gin)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: edutrack-backend
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edutrack-network

  # 4. Nginx (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: edutrack-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - edutrack-network

networks:
  edutrack-network:
    driver: bridge

volumes:
  postgres_data: