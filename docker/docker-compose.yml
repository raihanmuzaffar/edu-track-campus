services:
  # 1. Database PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: edutrack-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edutrack-network
    healthcheck:
      # Pakai $$ agar compose tidak meng-interpolate; env var dibaca dari dalam container
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # 2. Cache Redis
  redis:
    image: redis:7-alpine
    container_name: edutrack-redis
    ports:
      - "6379:6379"
    networks:
      - edutrack-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # 3. Mailpit (Email Testing)
  mailpit:
    image: axllent/mailpit
    container_name: edutrack-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - edutrack-network
    restart: unless-stopped

  # 4. Backend Go (Gin)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: edutrack-backend
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edutrack-network
    # KUNCI: kalau container gagal start (mis. DNS error), Docker otomatis restart
    restart: unless-stopped
    # Fallback jika error DNS embedded (127.0.0.11) masih muncul sesekali:
    # dns:
    #   - 1.1.1.1
    #   - 8.8.8.8

  # 5. Nginx (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: edutrack-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - edutrack-network
    restart: unless-stopped

networks:
  edutrack-network:
    driver: bridge

volumes:
  postgres_data: