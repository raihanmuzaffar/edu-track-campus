name: Mobile CI (Flutter)

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'mobile/**' # KUNCI: Hanya jalan jika folder mobile berubah

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        cache: true

    - name: Get Dependencies
      working-directory: ./mobile
      run: flutter pub get

    - name: Analyze Code
      working-directory: ./mobile
      run: flutter analyze